# Surefire's -Dtest, which mn:test maps to its filter
test=GreeterTest,OtherTest#greets+counts
# a report path of its own, in place of the default /tests/
mn.test.reportPath=/test-report/
# resolves Micronaut Core with micronaut-dev from the build's repository and Maven Central only: see
# src/it/local-core.groovy
it.mirror-of-build-repository = *,!central,!local.central

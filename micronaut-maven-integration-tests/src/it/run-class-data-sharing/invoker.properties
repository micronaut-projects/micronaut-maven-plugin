# 1. The first launch records its class list; the goal waits for the archive before it ends.
invoker.goals.1 = -ntp -e mn:run -Dmn.watch=false -Dmn.classDataSharing -Dmn.jvmArgs=-Xlog:class+load:file=class-load-1.log
# 2. The second launch uses the archive.
invoker.goals.2 = -ntp -e mn:run -Dmn.watch=false -Dmn.classDataSharing -Dmn.jvmArgs=-Xlog:class+load:file=class-load-2.log
# 3. With a debugger (JDWP), the launch still uses the archive.
invoker.goals.3 = -ntp -e mn:run -Dmn.watch=false -Dmn.classDataSharing -Dmn.debug -Dmn.debug.port=0 -Dmn.jvmArgs=-Xlog:class+load:file=class-load-debug.log

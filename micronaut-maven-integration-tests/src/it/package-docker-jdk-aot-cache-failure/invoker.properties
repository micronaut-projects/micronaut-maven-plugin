# A training path that answers 404 fails the build on a Micronaut version without the training-run switch
# (it.micronaut.noTrainingSwitch.version in the pom.xml of the integration tests), where the plugin sends the requests.
# With the switch, Micronaut sends them and only warns about a status from 400 to 499.
invoker.goals = -ntp package -Dpackaging=docker -Dmicronaut.docker.jdkAotCache=true -Dmicronaut.docker.jdkAotCache.trainingMode=start
invoker.buildResult = failure

invoker.os.family = !windows

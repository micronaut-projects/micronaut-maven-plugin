# The training run of a Micronaut version without the training-run switch (it.micronaut.noTrainingSwitch.version in the
# pom.xml of the integration tests): it starts the application, and the plugin warms it up and stops it with SIGTERM.
# Training paths and no training mode: the build also logs the warning that says it fails with a Micronaut version that
# has the load training mode, where it needs -Dmicronaut.docker.jdkAotCache.trainingMode=start.
invoker.goals = -ntp package -Dpackaging=docker -Dmicronaut.docker.jdkAotCache=true -Dmicronaut.docker.jdkAotCache.trainingPaths=/hello docker:start docker:stop

invoker.os.family = !windows

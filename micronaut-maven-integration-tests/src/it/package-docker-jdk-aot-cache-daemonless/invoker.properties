invoker.goals = -ntp package -Dpackaging=docker -Djib.buildGoal=buildTar -Dmicronaut.docker.jdkAotCache=true
invoker.buildResult = failure
# No Docker daemon: the training run cannot happen, even though buildTar itself needs no daemon
invoker.environmentVariables.DOCKER_HOST = unix:///nonexistent/docker.sock

invoker.os.family = !windows

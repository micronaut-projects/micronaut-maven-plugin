# 1. Build both modules, which installs the library whose JAR has a logback.xml, as the application does.
invoker.goals.1 = -ntp install
# 2. Run the application on its own, so that the library is a JAR from the local repository: the duplicate keeps the
#    usual class path order and no archive.
invoker.project.2 = app
invoker.goals.2 = -ntp -e mn:run -Dmn.watch=false -Dmn.classDataSharing

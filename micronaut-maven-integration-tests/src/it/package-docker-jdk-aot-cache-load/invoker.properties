# The application cannot start where the image is built: its Backend bean connects to a closed port when it is created.
# 1. A training run that starts the application fails the build
invoker.goals.1 = -ntp package -Dpackaging=docker -Dmicronaut.docker.jdkAotCache=true -Dmicronaut.docker.jdkAotCache.trainingMode=start
invoker.buildResult.1 = failure
# 2. The default training run loads the application without starting it, and the image starts with the cache
invoker.goals.2 = -ntp package -Dpackaging=docker -Dmicronaut.docker.jdkAotCache=true docker:start docker:stop

invoker.os.family = !windows

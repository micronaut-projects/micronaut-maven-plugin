# 1. The first launch records its class list, and the goal leaves the archive behind.
invoker.goals.1 = -ntp -e mn:run -Dmn.watch=false -Dmn.classDataSharing
# 2. With the native image agent, the launch still uses the archive, and the agent still writes its metadata.
invoker.goals.2 = -ntp -e mn:run -Dmn.watch=false -Dmn.classDataSharing -Dagent=true -Dmn.jvmArgs=-Xlog:class+load:file=class-load-agent.log

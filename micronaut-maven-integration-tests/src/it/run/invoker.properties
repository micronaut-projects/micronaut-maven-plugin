# 1: default command line, which must not start the JMX agent
invoker.goals.1 = -ntp -e mn:run -Dmn.watch=false -Dmn.appArgs="-v"
# 2: opting back in through the JVM arguments
invoker.goals.2 = -ntp -e mn:run -Dmn.watch=false -Dmn.appArgs="-v" -Dmn.jvmArgs=-Dcom.sun.management.jmxremote
# 3: opting back in through a user property, which mn:run passes on to the application
invoker.goals.3 = -ntp -e mn:run -Dmn.watch=false -Dmn.appArgs="-v" -Dcom.sun.management.jmxremote

# Watch mode: the application restarts itself twice by changing a resource, then stops Maven with SIGTERM,
# so the build ends with a failure on purpose. -X shows the launch commands and the debug log of class data sharing.
invoker.goals = -ntp -e -X mn:run -Dmn.classDataSharing -Dmn.jvmArgs=-Xlog:class+load:file=class-load-%p.log
invoker.buildResult = failure
invoker.timeoutInSeconds = 600
# ProcessHandle.destroy() is forcible on Windows, which would skip Maven's shutdown hooks
invoker.os.family = !windows

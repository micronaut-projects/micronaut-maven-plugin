name: Release
on:
  release:
    types: [published]

# Release mutations are performed with the dedicated GH_TOKEN secret, not the default workflow token.
permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      DEVELOCITY_ACCESS_KEY: ${{ secrets.GRADLE_ENTERPRISE_ACCESS_KEY }}
      DEVELOCITY_CACHE_USERNAME: ${{ secrets.GRADLE_ENTERPRISE_CACHE_USERNAME }}
      DEVELOCITY_CACHE_PASSWORD: ${{ secrets.GRADLE_ENTERPRISE_CACHE_PASSWORD }}
    steps:
      - name: "🗑 Remove system JDKs"
        run: |
          sudo rm -rf /usr/lib/jvm/*
          unset JAVA_HOME
          export PATH=$(echo "$PATH" | tr ':' '\n' | grep -v '/usr/lib/jvm' | paste -sd:)

      - name: "📥 Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}
          persist-credentials: false

      - name: "🛡 Verify Maven wrapper checksum"
        run: bash .github/scripts/verify-maven-wrapper-checksum.sh

      - name: "☕️ Install Java and Maven"
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'maven'

      - name: "🟰 Set the current release version"
        id: release_version
        run: |
          tag_name="${GITHUB_REF#refs/tags/}"
          echo "release_version=${tag_name#v}" >> "$GITHUB_OUTPUT"

      - name: "🔎 Vulnerability Audit"
        env:
          DEVELOCITY_ACCESS_KEY: ""
          DEVELOCITY_CACHE_USERNAME: ""
          DEVELOCITY_CACHE_PASSWORD: ""
          RELEASE_VERSION: ${{ steps.release_version.outputs.release_version }}
        run: |
          release_version="${RELEASE_VERSION}"
          if [[ "${release_version}" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+-(M|RC)[0-9]+$ ]]; then
            echo "Running vulnerability audit in advisory mode for ${release_version}"
            VULNERABILITY_AUDIT_ENFORCEMENT=advisory .github/scripts/vulnerability-audit.sh
          else
            .github/scripts/vulnerability-audit.sh
          fi

      - name: "🔐 Import GPG key"
        env:
          GPG_FILE: ${{ secrets.GPG_FILE }}
        run: |
          mkdir -p ~/.gnupg
          chmod 700 ~/.gnupg
          echo "$GPG_FILE" | base64 -d | gpg --batch --import
          gpg --list-secret-keys --keyid-format LONG

      - name: "☕️ Set up Apache Maven Central"
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: 'temurin'
          java-version: '25'
          server-id: central
          server-username: SONATYPE_USERNAME
          server-password: SONATYPE_PASSWORD

      - name: "🔑 Setup SSH key"
        uses: webfactory/ssh-agent@a6f90b1f127823b31d4d4a8d96047790581349bd
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: "🪾 Setup git"
        env:
          MICRONAUT_BUILD_EMAIL: ${{ secrets.MICRONAUT_BUILD_EMAIL }}
        run: |
          git config --global --add safe.directory /github/workspace
          git config --global user.email "$MICRONAUT_BUILD_EMAIL"
          git config --global user.name "micronaut-build"
          git remote set-url origin "git@github.com:${GITHUB_REPOSITORY}.git"
          echo "Checking out ${{ github.event.release.target_commitish }}"
          git checkout ${{ github.event.release.target_commitish }}
          # The release event is created from an existing tag. Keep the remote tag in
          # place so GitHub does not detach the published release and emit another
          # release event. Delete only the local copy so Maven can recreate it on the
          # release commit, then force-update the remote tag after release:prepare.
          git tag -d v${{ steps.release_version.outputs.release_version }} || true

      - name: "❓ Figure out next version"
        id: next_version
        run: |
          NV="$(bash .github/scripts/increment_version.sh -p "${{ steps.release_version.outputs.release_version }}")"
          echo "next_version=${NV}-SNAPSHOT" >> $GITHUB_OUTPUT

      - name: "⚙️ Prepare release"
        run: |
          ./mvnw --batch-mode release:prepare -DpushChanges=false -DreleaseVersion=${{ steps.release_version.outputs.release_version }} -Dtag=v${{ steps.release_version.outputs.release_version }} -DdevelopmentVersion=${{ steps.next_version.outputs.next_version }} -Darguments="-Dinvoker.skip=true"
          git push origin HEAD:${{ github.event.release.target_commitish }}
          git push origin v${{ steps.release_version.outputs.release_version }} --force
          cp -R target/site/apidocs/* micronaut-maven-plugin/target/site/apidocs

      - name: "🚪 Close release after updating the tag"
        run: |
          release_url="$(jq -er '.release.url' "$GITHUB_EVENT_PATH")"
          echo "$release_url"
          curl --fail-with-body --silent --show-error \
            --request PATCH \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Content-Type: application/json" \
            "$release_url" \
            --data '{"draft": false}'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: "📄 Publish docs to Github Pages"
        uses: micronaut-projects/github-pages-deploy-action@76d63aafbab7108d74e83be4e5b3b0501382e829
        env:
          BETA: ${{ contains(steps.release_version.outputs.release_version, 'M') || contains(steps.release_version.outputs.release_version, 'RC') }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          BRANCH: gh-pages
          FOLDER: micronaut-maven-plugin/target/site
          VERSION: ${{ steps.release_version.outputs.release_version }}
          TARGET_REPOSITORY: ${{ github.repository }}

      - name: "📦 Perform release"
        run: ./mvnw --batch-mode release:perform -Darguments="-Dinvoker.skip=true"
        env:
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSWORD }}

      - name: "↩️ Rollback release"
        if: failure()
        run: ./mvnw release:rollback

      - name: "🚪 Close milestone ${{ steps.release_version.outputs.release_version }}"
        if: success()
        uses: Beakyn/gha-close-milestone@cb86f414f1601acbebdf9339f07ff7ac6ac0f24c
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        with:
          repository: ${{ github.repository }}
          milestone-title: ${{ steps.release_version.outputs.release_version }}
